# Weekly dependency update PRs. Dependabot runs on GitHub's side and does not
# use this account's GitHub Actions minutes.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /admin-dashboard
      - /frontend-dashboard
      - /frontend-marketing
      - /backend-api
      - /agent-runtime
      - /workers/provisioner
      - /workers/backup
      - /mcp-server
      - /cli
      - /e2e
      - /services/headmaster-inference
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
